name: Update NestJS migration lockfile

on:
  push:
    branches:
      - agent/continue-nestjs-native-foundation

permissions:
  contents: write

jobs:
  lockfile-and-quality:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@10.33.2 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm quality
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: refresh pnpm lockfile [lockfile generated]"
          git push
