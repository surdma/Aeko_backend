name: NestJS migration quality

on:
  push:
    branches:
      - migration/nestjs-clean
      - agent/nestjs-*
  pull_request:
    branches:
      - migration/nestjs-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      rewritten: ${{ steps.commit.outputs.rewritten }}
    steps:
      - name: Checkout migration branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Load safe test environment
        run: cp .env.example .env

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Rewrite verifier to consume the email outbox directly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-nest-runtime.mts')
          text = path.read_text()
          marker = "function array(value: JsonObject, key: string, label: string): readonly unknown[] {"
          helper = r'''interface AuthEmailOutboxMessage {
            readonly to: string;
            readonly subject: string;
            readonly text: string;
          }

          function authEmailOutboxMessage(value: unknown): AuthEmailOutboxMessage | null {
            if (typeof value !== 'object' || value === null || Array.isArray(value)) return null;
            const to = Reflect.get(value, 'to');
            const subject = Reflect.get(value, 'subject');
            const text = Reflect.get(value, 'text');
            if (typeof to !== 'string' || typeof subject !== 'string' || typeof text !== 'string') {
              return null;
            }
            return { to, subject, text };
          }

          async function waitForVerificationUrl(email: string): Promise<URL> {
            const outboxPath = process.env.AUTH_EMAIL_OUTBOX_PATH;
            if (outboxPath === undefined) {
              throw new Error('AUTH_EMAIL_OUTBOX_PATH must be configured for runtime verification');
            }

            for (let attempt = 0; attempt < 60; attempt += 1) {
              try {
                const lines = (await readFile(outboxPath, 'utf8'))
                  .split('\n')
                  .filter((line) => line.length > 0)
                  .reverse();
                for (const line of lines) {
                  const message = authEmailOutboxMessage(JSON.parse(line) as unknown);
                  if (
                    message?.to !== email ||
                    message.subject !== 'Verify your Aeko email'
                  ) {
                    continue;
                  }
                  const urlText = /https?:\/\/\S+/u.exec(message.text)?.[0];
                  if (urlText !== undefined) return new URL(urlText);
                }
              } catch (error: unknown) {
                if (Reflect.get(Object(error), 'code') !== 'ENOENT') throw error;
              }
              await new Promise((done) => setTimeout(done, 100));
            }

            throw new Error('Better Auth verification email did not reach the disposable outbox');
          }

          '''
          if 'async function waitForVerificationUrl' not in text:
              if marker not in text:
                  raise SystemExit('Verifier insertion marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = r'''  const verification = await prisma.authVerification.findFirst({
            where: { identifier: { contains: email } },
            orderBy: { createdAt: 'desc' },
          });
          assert.ok(verification !== null, 'Better Auth did not persist an email verification token');
          await expectStatusIn(
            'GET',
            `/api/auth/verify-email?token=${encodeURIComponent(verification.value)}&callbackURL=%2F`,
            [200, 302],
          );'''
          new = r'''  const verificationUrl = await waitForVerificationUrl(email);
          await expectStatusIn(
            'GET',
            `${verificationUrl.pathname}${verificationUrl.search}`,
            [200, 302],
          );'''
          if old not in text:
              raise SystemExit('Verification query block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run the full quality gate
        run: pnpm quality

      - name: Commit verifier and restore frozen workflow
        id: commit
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin migration/nestjs-clean --depth=1
          git show FETCH_HEAD:.github/workflows/nestjs-migration-ci.yml > .github/workflows/nestjs-migration-ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-nest-runtime.mts .github/workflows/nestjs-migration-ci.yml
          if git diff --cached --quiet; then
            echo "rewritten=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "test: consume Better Auth verification email outbox"
          git push origin HEAD:"${HEAD_REF}"
          echo "rewritten=true" >> "$GITHUB_OUTPUT"

  runtime:
    needs: quality
    if: needs.quality.outputs.rewritten != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aeko
          POSTGRES_PASSWORD: aeko
          POSTGRES_DB: aeko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeko -d aeko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Load safe runtime environment
        run: cp .env.example .env

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Create disposable PostgreSQL schema
        run: pnpm prisma db push --skip-generate

      - name: Build and verify compiled Nest HTTP/database behavior
        run: |
          pnpm build
          pnpm runtime:verify
