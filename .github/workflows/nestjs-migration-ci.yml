name: NestJS migration quality

on:
  push:
    branches:
      - migration/nestjs-clean
      - agent/nestjs-*
  pull_request:
    branches:
      - migration/nestjs-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Load safe test environment
        run: cp .env.example .env

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Refresh dependencies and lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Run the full quality gate
        run: pnpm quality

      - name: Commit lockfile and restore frozen workflow
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin migration/nestjs-clean --depth=1
          git show FETCH_HEAD:.github/workflows/nestjs-migration-ci.yml > .github/workflows/nestjs-migration-ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml .github/workflows/nestjs-migration-ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: lock Better Auth dependencies"
          git push origin HEAD:"${HEAD_REF}"

      - name: Upload refreshed lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: better-auth-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

  runtime:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aeko
          POSTGRES_PASSWORD: aeko
          POSTGRES_DB: aeko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeko -d aeko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout migration branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Load safe runtime environment
        run: cp .env.example .env

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Install refreshed dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create disposable PostgreSQL schema
        run: pnpm prisma db push --skip-generate

      - name: Build and verify compiled Nest HTTP/database behavior
        run: |
          pnpm build
          pnpm runtime:verify
