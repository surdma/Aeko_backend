name: NestJS migration quality

on:
  pull_request:
    branches:
      - migration/nestjs-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration continuation
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Install and refresh the migration lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Run the full quality gate
        run: pnpm quality

      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-migration-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
